                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label bg-tertiary/10 text-tertiary border border-tertiary/30 shadow-[0_0_10px_rgba(255,193,118,0.5)]">F1</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-primary hover:text-primary-container font-code-label text-code-label transition-colors flex items-center gap-[0.25rem]"><span class="material-symbols-outlined text-[16px]">edit_square</span> 编辑信息</button></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-on-surface-variant group-hover:text-tertiary-container transition-colors"><span class="material-symbols-outlined" data-weight="fill">location_on</span></button></td>
            </tr>
            <tr class="hover:bg-surface-container-highest/30 transition-colors group w-full">
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label bg-primary/10 text-primary border border-primary/30 shadow-[0_0_10px_rgba(56,189,248,0.5)]">110</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label bg-primary-container/10 text-primary-container border border-primary-container/30 shadow-[0_0_10px_rgba(56,189,248,0.5)]">Unit-B</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label bg-tertiary/10 text-tertiary border border-tertiary/30 shadow-[0_0_10px_rgba(255,193,118,0.5)]">F1</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-primary hover:text-primary-container font-code-label text-code-label transition-colors flex items-center gap-[0.25rem]"><span class="material-symbols-outlined text-[16px]">edit_square</span> 编辑信息</button></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-on-surface-variant group-hover:text-tertiary-container transition-colors"><span class="material-symbols-outlined" data-weight="fill">location_on</span></button></td>
            </tr></tbody>
</table>
</div>
<!-- Pagination Footer -->
<div class="flex items-center px-[2vw] py-[1rem] border-t border-outline-variant/30 bg-surface-container-low/50 justify-end gap-[1rem] w-full flex-wrap">
<!-- Page Numbers -->
<div class="flex items-center gap-[0.5rem] font-code-label text-code-label flex-wrap" id="pagination-numbers"><button class="w-8 h-8 flex items-center justify-center rounded border border-outline-variant text-on-surface-variant opacity-50 cursor-not-allowed" disabled=""><span class="material-symbols-outlined text-[16px]">chevron_left</span></button><button class="w-8 h-8 flex items-center justify-center rounded border border-primary bg-primary/20 text-primary shadow-[0_0_10px_rgba(56,189,248,0.3)] transition-colors">1</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors">2</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors">3</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors">4</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors">5</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors">6</button><button class="w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-[16px]">chevron_right</span></button></div>
<!-- Right Dropdown -->
<div class="relative group">
<button class="flex items-center gap-[0.25rem] px-[1rem] py-[0.5rem] bg-surface-container border border-outline-variant rounded font-code-label text-code-label text-on-surface hover:border-primary transition-colors">
<span class="" id="page-info-text">6页/page</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">arrow_drop_down</span>
</button>
<!-- Page Select Dropdown -->
<div class="absolute bottom-full right-0 mb-xs w-32 bg-layer-2 rounded border border-outline-variant opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
<ul class="py-xs font-code-label text-code-label text-on-surface max-h-48 overflow-y-auto">
<li class="page-size-option px-[1rem] py-[0.5rem] hover:bg-surface-container-highest cursor-pointer flex justify-between items-center text-primary bg-primary/10" data-size="10" onclick="changePageSize(10)">10 / page <span class="material-symbols-outlined text-[14px]">check</span></li>
<li class="page-size-option px-[1rem] py-[0.5rem] hover:bg-surface-container-highest cursor-pointer flex justify-between items-center" data-size="20" onclick="changePageSize(20)">20 / page</li>
<li class="page-size-option px-[1rem] py-[0.5rem] hover:bg-surface-container-highest cursor-pointer flex justify-between items-center" data-size="50" onclick="changePageSize(50)">50 / page</li>
</ul>
</div>
</div>
</div>
</div>
</main>
<script>
    // Generate dummy dataset (e.g. 56 items to show 6 pages of 10)
    const dummyData = Array.from({length: 56}, (_, i) => ({
        room: `${Math.floor(i/10)+1}${String((i%10)+1).padStart(2, '0')}`,
        unit: `Unit-${i%2===0?'A':'B'}`,
        floor: `F${Math.floor(i/10)+1}`
    }));

    let currentPage = 1;
    let rowsPerPage = 10;

    function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = dummyData.slice(start, end);

        pageData.forEach(item => {
            tbody.innerHTML += `
            <tr class="hover:bg-surface-container-highest/30 transition-colors group w-full">
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label pill text-primary-container" style="text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);">${item.room}</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label pill text-primary-container" style="text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);">${item.unit}</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><span class="inline-flex items-center px-[0.5rem] py-[2px] rounded-full font-code-label text-code-label pill text-primary-container" style="text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);">${item.floor}</span></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-primary hover:text-primary-container font-code-label text-code-label transition-colors flex items-center gap-[0.25rem]"><span class="material-symbols-outlined text-[16px]">edit_square</span> 编辑信息</button></td>
                <td class="py-[1rem] px-[2%] w-[20%]"><button class="text-on-surface-variant group-hover:text-tertiary-container transition-colors"><span class="material-symbols-outlined" data-weight="fill">location_on</span></button></td>
            </tr>`;
        });
    }

    function renderPagination() {
        const totalPages = Math.ceil(dummyData.length / rowsPerPage);
        document.getElementById('page-info-text').innerText = `${totalPages}页/page`;
        
        const pageNumContainer = document.getElementById('pagination-numbers');
        pageNumContainer.innerHTML = '';

        // Prev Button
        const prevBtn = document.createElement('button');
        prevBtn.className = `w-8 h-8 flex items-center justify-center rounded border ${currentPage === 1 ? 'border-outline-variant text-on-surface-variant opacity-50 cursor-not-allowed' : 'border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors'}`;
        prevBtn.disabled = currentPage === 1;
        prevBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">chevron_left</span>';
        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; updateView(); } };
        pageNumContainer.appendChild(prevBtn);

        // Calculate pages to show
        let pagesToShow = [];
        if (totalPages <= 6) {
            for (let i = 1; i <= totalPages; i++) pagesToShow.push(i);
        } else {
            if (currentPage <= 3) pagesToShow = [1, 2, 3, 4, '...', totalPages];
            else if (currentPage >= totalPages - 2) pagesToShow = [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
            else pagesToShow = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
        }

        // Render page buttons
        pagesToShow.forEach(p => {
            if (p === '...') {
                const span = document.createElement('span');
                span.className = 'text-on-surface-variant px-[0.25rem]';
                span.innerText = '...';
                pageNumContainer.appendChild(span);
            } else {
                const btn = document.createElement('button');
                if (p === currentPage) {
                    btn.className = 'w-8 h-8 flex items-center justify-center rounded border border-primary bg-primary/20 text-primary shadow-[0_0_10px_rgba(56,189,248,0.3)] transition-colors';
                } else {
                    btn.className = 'w-8 h-8 flex items-center justify-center rounded border border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors';
                }
                btn.innerText = p;
                btn.onclick = () => { currentPage = p; updateView(); };
                pageNumContainer.appendChild(btn);
            }
        });

        // Next Button
        const nextBtn = document.createElement('button');
        nextBtn.className = `w-8 h-8 flex items-center justify-center rounded border ${currentPage === totalPages ? 'border-outline-variant text-on-surface-variant opacity-50 cursor-not-allowed' : 'border-transparent hover:border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors'}`;
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">chevron_right</span>';
        nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; updateView(); } };
        pageNumContainer.appendChild(nextBtn);
    }

    function updateView() {
        renderTable();
        renderPagination();
    }

    function changePageSize(size) {
        rowsPerPage = size;
        currentPage = 1;
        updateView();
        
        // Update styling of dropdown options
        document.querySelectorAll('.page-size-option').forEach(el => {
            const isSelected = el.dataset.size == size;
            el.innerHTML = `${el.dataset.size} / page ${isSelected ? '<span class="material-symbols-outlined text-[14px]">check</span>' : ''}`;
            if(isSelected) {
                el.classList.add('text-primary', 'bg-primary/10');
            } else {
                el.classList.remove('text-primary', 'bg-primary/10');
            }
        });
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', updateView);
</script>
